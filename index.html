<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Content Access</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            position: fixed;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            padding: 80px 20px 20px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        .content-item {
            position: relative;
            aspect-ratio: 3/4;
            background-color: #222;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }

        /* The Blurred Image */
        .blur-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://placehold.net/300x400/222/222?text=Locked'); /* Placeholder for blurred image */
            background-size: cover;
            background-position: center;
            filter: blur(20px);
            z-index: 1;
            transition: filter 0.3s;
        }

        .lock-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 50%;
            border: 2px solid white;
        }

        /* Payment Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .payment-box {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .price-tag {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
            margin: 20px 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button.pay-btn {
            width: 100%;
            padding: 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        button.close-btn {
            background: transparent;
            color: #666;
            border: none;
            margin-top: 15px;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Success State */
        .unlocked .blur-overlay {
            display: none;
        }
        .unlocked .lock-icon {
            display: none;
        }
        
        .warning-text {
            color: #ff4444;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <h3>🔒 Exclusive Content</h3>
    <p style="font-size: 12px; color: #aaa;">Verification required to view</p>
</header>

<div class="content-grid">
    <!-- These are placeholders. In a real scenario, you would put your actual image URLs in the background-image style below, but blurred via CSS. 
         For this demo, we use placeholders. -->
    <div class="content-item" onclick="openPayment()">
        <div class="blur-overlay" style="background-image: url('https://placehold.net/300x400/333/fff?text=Private+1')"></div>
        <div class="lock-icon">🔒</div>
    </div>
    <div class="content-item" onclick="openPayment()">
        <div class="blur-overlay" style="background-image: url('https://placehold.net/300x400/333/fff?text=Private+2')"></div>
        <div class="lock-icon">🔒</div>
    </div>
    <div class="content-item" onclick="openPayment()">
        <div class="blur-overlay" style="background-image: url('https://placehold.net/300x400/333/fff?text=Private+3')"></div>
        <div class="lock-icon">🔒</div>
    </div>
    <div class="content-item" onclick="openPayment()">
        <div class="blur-overlay" style="background-image: url('https://placehold.net/300x400/333/fff?text=Private+4')"></div>
        <div class="lock-icon">🔒</div>
    </div>
</div>

<!-- Payment Modal -->
<div id="paymentModal" class="modal">
    <div class="payment-box">
        <h2>Unlock Content</h2>
        <p>Pay to view exclusive photos.</p>
        <div class="price-tag">$6.00 USD</div>
        
        <form id="fakeForm" onsubmit="processPayment(event)">
            <input type="text" placeholder="Card Number" required maxlength="19">
            <div style="display: flex; gap: 10px;">
                <input type="text" placeholder="MM/YY" required maxlength="5">
                <input type="text" placeholder="CVC" required maxlength="3">
            </div>
            <input type="text" placeholder="Full Name on Card" required>
            <button type="submit" class="pay-btn">Pay $6.00</button>
        </form>
        <p class="warning-text">⚠️ Demo Only: No real money will be charged.</p>
        <button class="close-btn" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
    function openPayment() {
        document.getElementById('paymentModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('paymentModal').style.display = 'none';
    }

    function processPayment(e) {
        e.preventDefault();
        const btn = document.querySelector('.pay-btn');
        btn.textContent = "Processing...";
        btn.disabled = true;

        setTimeout(() => {
            // Simulate success
            closeModal();
            alert("Payment Successful! Unlocking content...");
            unlockContent();
            btn.textContent = "Pay $6.00";
            btn.disabled = false;
        }, 2000);
    }

    function unlockContent() {
        // In a real app, this would redirect to a private URL.
        // Here we just remove the blur for demonstration.
        const items = document.querySelectorAll('.content-item');
        items.forEach(item => {
            item.classList.add('unlocked');
            // Replace placeholder with a "revealed" message or actual image
            item.innerHTML = '<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#222; color:white;">Content Unlocked</div>';
        });
    }

    // Close modal if clicking outside
    window.onclick = function(event) {
        const modal = document.getElementById('paymentModal');
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }
</script>

</body>
</html>
